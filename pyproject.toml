[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quorum-council"
version = "0.1.0"
description = "A council of language models that scores a claim against a rubric, from evidence you supply."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mark Lynd" }]
keywords = ["llm", "council", "rubric", "scoring", "deliberation", "mcp", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "PyYAML>=6.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
quorum = "quorum.cli:main"

[project.urls]
Homepage = "https://github.com/marklynd/quorum"
Issues = "https://github.com/marklynd/quorum/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quorum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
